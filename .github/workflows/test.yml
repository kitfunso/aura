name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # aura has no darwin-specific branch, so macOS and Linux run the same code.
    # Both are here anyway: only a real macOS runner proves the macOS claim.
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: aura has zero runtime and zero dev dependencies.
      - run: npm test
        env:
          # A runner inherits no terminal, and a leaked marker would send the
          # suite down the Windows Terminal branch on every OS.
          WT_SESSION: ''
          TERM_PROGRAM: ''
